name: ask-romeo

services:
  app:
    container_name: ask-romeo-app
    build:
      context: .
      dockerfile: Dockerfile
    image: ask-romeo-app:prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://ask-romeo.ru}
      ASKROMEO_RAG_STORE: postgres
      ASKOOSU_RATE_LIMIT_STORE: postgres
      ASKOOSU_FAQ_SEMANTIC_ROUTER_ENABLED: 'false'
      ASKOOSU_AI_PROVIDER: openai
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

  postgres:
    container_name: ask-romeo-postgres
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - '127.0.0.1:${ASKOOSU_POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - ask-romeo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

volumes:
  ask-romeo-postgres-data:
